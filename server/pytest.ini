[tool:pytest]
# Pytest configuration for RAG Document Management System

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers
markers =
    integration: Integration tests that require database and external services
    unit: Unit tests that test individual components in isolation
    slow: Tests that take longer than usual to run
    auth: Tests related to authentication and authorization
    s3: Tests that interact with S3 storage
    documents: Tests related to document management
    api: API endpoint tests

# Test coverage (if coverage is installed)
# addopts = --cov=app --cov-report=html --cov-report=term-missing

# Minimum Python version
minversion = 3.9

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:boto3.*